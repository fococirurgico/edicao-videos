# Configuração padrão do programa. Uma atualização substitui este arquivo.
# Ajustes de um computador (como a identidade de marca) ficam fora da pasta do programa e
# não se perdem ao atualizar: use o comando `edicao marca`. Detalhes no README.

[transcricao]
# "auto" usa mlx no Apple Silicon (se instalado) e faster-whisper no resto.
# Opções: "auto", "mlx", "faster-whisper"
backend = "auto"
# Tamanhos: "tiny", "base", "small", "medium", "large-v3". Maior = mais preciso e mais lento.
modelo = "small"
idioma = "pt"

[decisao]
# Quem decide retakes, destaques e zoom:
# "assinatura" = Claude Code instalado no Mac (usa a sua assinatura do Claude)
# "api"        = API da Anthropic (precisa de ANTHROPIC_API_KEY e de: pip install anthropic)
# "nenhum"     = sem decisão: mantém tudo, sem destaques nem zoom
backend = "assinatura"
# Modelo no Claude Code (ex.: "sonnet", "opus"); vazio usa o padrão da sua conta.
modelo = ""
# Modelo quando backend = "api".
modelo_api = "claude-opus-5-5"
# Tempo máximo de espera pela resposta (segundos).
timeout = 300
# Maior zoom que o Claude pode pedir.
zoom_maximo = 1.4

[enquadramento]
# Acompanha os olhos ao aplicar o zoom. false = zoom sempre centralizado na imagem.
rastrear_rosto = true
# Altura dos olhos no quadro final, a partir do topo (0,5 = centro; 0,42 = um pouco acima).
altura_olhos = 0.42
# Distância mínima dos olhos até as bordas do quadro; se não couber, o zoom do trecho diminui.
margem_olhos = 0.12
# Quadros analisados por segundo para achar os olhos.
amostras_por_segundo = 5
# Duração da aproximação no zoom "rápido" (segundos).
duracao_zoom_rapido = 0.45
# Corte seco: quando a fala é cortada e o enquadramento ficaria igual dos dois lados,
# o zoom muda nesse valor para disfarçar o corte. 0 desliga.
salto_nos_cortes = 0.15
# Ritmo dos Reels: em fala contínua, o enquadramento muda pelo menos a cada `plano_maximo`
# segundos, alternando o nível em `variacao_ritmo` com aproximação suave. 0 desliga.
plano_maximo = 3.0
variacao_ritmo = 0.15

[cortes]
# Volume abaixo do qual o áudio conta como silêncio (dB).
limiar_db = -35
# Silêncios mais curtos que isso (segundos) não são cortados.
silencio_minimo = 0.5
# Folga mantida antes e depois de cada trecho falado (segundos).
folga = 0.08
# Fade de áudio em cada emenda (segundos), evita estalos.
fade_audio = 0.02

[marca]
# Identidade de marca. Configure com `edicao marca` (perguntas ou leitura do manual de marca).
nome = ""
# Quem fala nos vídeos, para o Claude entender o contexto (ex.: "um médico cirurgião").
autor = ""
# Para quem são os vídeos e o tom da comunicação; ajudam o Claude a escolher destaques.
publico = ""
tom = ""
# Fonte da legenda: o nome de uma fonte instalada no Mac. Para usar um arquivo .ttf/.otf da
# marca sem instalar, `edicao marca --fonte ARQUIVO` copia o arquivo e preenche os dois campos.
fonte = "Helvetica Neue"
arquivo_fonte = ""
negrito = true
italico = false
cor_texto = "#FFFFFF"
cor_palavra_atual = "#FFD400"
cor_destaque = "#00E5FF"
cor_contorno = "#000000"
# Cores dos elementos gráficos (título e cartões): cartão claro e o texto dele, cartão escuro
# e o texto dele, e a cor de acento (barras, ícones, números).
cor_cartao = "#FFFFFF"
cor_texto_cartao = "#111111"
cor_cartao_escuro = "#111111"
cor_texto_escuro = "#FFFFFF"
cor_acento = "#FFD400"
# Paleta completa da marca (hex), para usos futuros como o material de apoio.
cores = []

[legendas]
tamanho = 110
# Espessura do contorno das letras e da sombra, em pixels.
contorno = 5
sombra = 3
# 1 = só a palavra dita aparece, em cor_texto. Mais de 1 = blocos com a palavra atual em
# cor_palavra_atual e os destaques em cor_destaque.
palavras_por_linha = 1
# Entrada com "pop" de cada palavra (só no modo de uma palavra por vez).
animacao = true
# Tamanho das palavras de destaque, em % do normal (modo de uma palavra por vez).
escala_destaque = 125
# Distância da legenda até a borda de baixo, em pixels (vídeo 1080x1920).
margem_inferior = 520

[graficos]
# Título do Reels num cartão no início (sugerido pelo Claude; `--titulo` ou `--sem-titulo`).
titulo = true
duracao_titulo = 3.2
tamanho_titulo = 100
# Altura do centro do título e dos cartões, em pixels a partir do topo (vídeo 1080x1920).
altura_titulo = 290
altura_elementos = 285
# Cartões durante a fala (número, frase-chave, check, alerta), escolhidos pelo Claude.
elementos = true
duracao_minima = 2.2
duracao_maxima = 4.0
# Intervalo mínimo entre dois cartões (segundos).
intervalo_minimo = 1.0

[video]
largura = 1080
altura = 1920
# Vídeo SDR: "libx264" funciona em qualquer Mac; "h264_videotoolbox" usa o hardware do Mac
# (mais rápido, qualidade por `taxa_videotoolbox`).
codec = "libx264"
# Qualidade do libx264: menor = melhor e maior (17 é visualmente sem perda). "slow" comprime
# melhor que o padrão, à custa de tempo.
crf = 17
preset = "slow"
taxa_videotoolbox = "20M"
# Vídeo HDR do iPhone (HLG): "manter" sai em HDR (HEVC 10 bits); "converter" sai em SDR.
hdr = "manter"
# HDR: "libx265" funciona em qualquer Mac; "hevc_videotoolbox" usa o hardware (Apple Silicon).
codec_hdr = "libx265"
crf_hdr = 18
preset_hdr = "medium"
