[project]
name = "edicao-videos"
version = "0.6.3"
description = "Pipeline automático de edição de vídeos curtos"
requires-python = ">=3.11"
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24", "fonttools>=4.40", "av>=14"]

[project.optional-dependencies]
# Mac Intel (e também funciona no Apple Silicon, só que sem usar a GPU)
intel = ["faster-whisper>=1.0"]
# Mac Apple Silicon (M1, M2, ...): usa a GPU via MLX
mx = ["mlx-whisper>=0.4", "faster-whisper>=1.0"]
# Só se usar a decisão pela API em vez da assinatura
api = ["anthropic>=0.80"]
dev = ["pytest>=8"]

[project.scripts]
edicao = "edicao.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["edicao"]
